<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 	<head th:replace ="combo/head.html :: head" ></head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="stylesheet" type="text/css" th:href="@{/styles/login.css}">
        <link rel="stylesheet" type="text/css" th:href="@{/styles/General.css}"> 
    	<link rel="stylesheet" type="text/css" th:href="@{/styles/fuenteColor.css}">  	
    	<link rel="stylesheet" type="text/css" th:href="@{/styles/NavBar.css}"> 
        <title> MARKETING</title>
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body class="colorbody">
    	<header th:replace="combo/navBar.html :: navbar"></header>
			 <!-- Encabezado general -->
			 		 <!-- Encabezado general -->
	<div class="containerFlex" id="encabezado">
		<div class="local">
			<h2 class="letraBlue" th:replace="combo/comboLocal.html :: comboLocal"></h2>
		</div>
	
		<div class="descripcion"> 
			<h2 class="tituloAFcenter">CREAR TANQUES DE ALMACENAMIENTO</h2>
		</div>
		<div class="fechahora">
			<h2 class="letra" th:replace="combo/FechaHoraActual.html :: comboFechaHora">
				
		</div>
		
	</div>
	<div class="Container1">
		<form class="containerTable">
			<div class="container" style="margin-top: 50px; margin-bottom: 50px;">
				
			<div id="cajaprincipal" class="cajaprincipal">
				<div id="caja1">
					<div id="NombreTercero" class="containerFlexCenter2" style="width: 600px;">
			
						<div class="containerFlexCenterNombre">
			
							<label class="letra" for="nombreTanque" style="margin: 15px;">NOMBRE TANQUE:</label>
							<input type="text" id="nombreTanque" style="width: 270px; margin-left: 50px;" th:value="${MaximoIdTercero}" oninput="limitarLongitud(this, 50)">
						</div>
			
			
					</div>
				</div>
			
				<div id="caja2">
					<div id="NombreTercero" class="containerFlexCenter2" style="width: 600px;">
			
			
						<div class="containerFlexCenterNombre">
									
						<label class="letra" for="largo" style="margin: 15px;">LARGO (metros):</label>
						<input type="text" id="largo" style="width: 380px; margin-left: 50px;" th:value="${xLargo}" oninput="limitarLongitud(this, 7)">
					</div>

			
					</div>
				</div>
			</div>
			
			<div id="cajaprincipal" class="cajaprincipal">
					<div id="caja1">
						<div id="NombreTercero" class="containerFlexCenter2" style="width: 600px;">
				
							<div class="containerFlexCenterNombre">
				
								<label class="letra" for="ancho" style="margin: 15px;">ANCHO (metros):</label>
								<input type="number" id="ancho" style="width: 270px; margin-left: 63px;" th:value="${xAncho}" oninput="limitarLongitud(this, 7)">
							</div>
				
				
						</div>
					</div>
				
					<div id="caja2">
						<div id="NombreTercero" class="containerFlexCenter2" style="width: 600px;">
				
				
							<div class="containerFlexCenterNombre">
										
								<label class="letra" for="profundidad" style="margin: 15px;">PROFUNDIDAD (metros):</label>
								<input type="number" id="profundidad" style="width: 270px; margin-left: 63px;" th:value="${xProfundidad}" oninput="limitarLongitud(this, 7)">
							</div>
				
				
						</div>
					</div>
				</div>
			

	
			</div>
			
		
				<div class="divCencer">
					<!-- Botón para enviar el formulario -->
					<a href="./Tanques" class="btn btn-success" style="margin: 50px;">Regresar</a>
					<button type="button" class="btn btn-primary" onclick="crearTanque()" >Crear Tanque</button>
					
				</div>
     		
		</form>
	</div>
	
	
	
	
	
	
	

    <script th:inline="javascript" src="./js/contadorRegresivo.js"></script>
    <script th:inline="javascript">
		
	
	function limitarLongitud(elemento, maximo) {
			if (elemento.value.length > maximo) {
				elemento.value = elemento.value.slice(0, maximo);
			}
		}	
		
		
	function crearTanque() {
		
		var nombreTanque = document.getElementById("nombreTanque").value;
		var largo = document.getElementById("largo").value;
		var ancho = document.getElementById("ancho").value;
		var profundidad = document.getElementById("profundidad").value;
		
		
	
	
		if (!nombreTanque) {
		        alert("Por favor, ingrese una descripción.");
		        return;
		    }
		
			
		if (!largo) {
        alert("Por favor, ingrese una descripción.");
        return;
    }
	
	if (!ancho) {
	        alert("Por favor, ingrese una descripción.");
	        return;
	    }
		
		if (!profundidad) {
		        alert("Por favor, ingrese una descripción.");
		        return;
		    }


		
		// Crear un objeto que contenga los datos a enviar
    var datos = {
			nombreTanque: nombreTanque,
			largo: largo,
			ancho: ancho,
			profundidad: profundidad,
        
    };
    
    // Realizar una solicitud POST al controlador
    fetch("./CrearTanque-Post", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify(datos),
    })
    .then((response) => response.json())
    .then((data) => {
		
		var message = data.message;
       console.log(message);
       
      
       var nombreTanque = data.nombreTanque
       
          swal({
            title: "¡Tanque: " + nombreTanque + " creado correctamente!" ,
            //text: "La PQR  " + numeroRadicado + " ha sido creada correctamente",
            icon: "success",
            button: "Continuar",
        })
        .then((value) => {
            // Redirigimos a la vista "CrearSuscriptor"" al hacer clic en el botón Continuar
            if (value) {
                window.location.href = "./Tanques";
            }
        });

    })
    .catch((error) => {
        console.error("Error al registrar el log:", error);
    });
    
		
	
	}
		
	
	
	</script>
</body>
</html>
